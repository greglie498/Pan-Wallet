openapi: 3.0.3
info:
  title: PanWallet API
  version: 1.0.0
  description: Full API contract for the PanWallet academic prototype.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Wallets
  - name: Transactions
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user and default internal wallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/firebase:
    post:
      tags: [Auth]
      summary: Sign in with a Firebase ID token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [idToken], properties: { idToken: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/TokensSuccess' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /wallets:
    get:
      tags: [Wallets]
      security: [{ bearerAuth: [] }]
      summary: List the current user's wallets
      responses: { '200': { $ref: '#/components/responses/WalletListSuccess' } }
  /wallets/link:
    post:
      tags: [Wallets]
      security: [{ bearerAuth: [] }]
      summary: Link an M-Pesa or MTN MoMo wallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkWalletInput' }
      responses: { '201': { $ref: '#/components/responses/WalletSuccess' } }
  /wallets/{walletId}:
    get:
      tags: [Wallets]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WalletId' }]
      summary: Get a wallet
      responses: { '200': { $ref: '#/components/responses/WalletSuccess' } }
  /wallets/{walletId}/topup:
    post:
      tags: [Wallets]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WalletId' }]
      summary: Top up a wallet in the prototype environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: number, exclusiveMinimum: 0 } } }
      responses: { '200': { $ref: '#/components/responses/WalletSuccess' } }
  /wallets/{walletId}/unlink:
    delete:
      tags: [Wallets]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WalletId' }]
      summary: Unlink a non-internal wallet
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /transactions/quote:
    post:
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      summary: Get a transfer quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /transactions:
    get:
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      summary: List the current user's transactions
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      summary: Initiate a transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TransactionId' }]
      summary: Get a transaction
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /transactions/mpesa/callback:
    post:
      tags: [Transactions]
      summary: Receive an M-Pesa provider callback
      description: Provider-only endpoint. The callback URL contains the required secret token; it is never called by the mobile client.
      parameters: [{ $ref: '#/components/parameters/CallbackToken' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /transactions/mtn/callback:
    post:
      tags: [Transactions]
      summary: Receive an MTN MoMo provider callback
      description: Provider-only endpoint. The callback URL contains the required secret token; it is never called by the mobile client.
      parameters: [{ $ref: '#/components/parameters/CallbackToken' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/login:
    post:
      tags: [Admin]
      summary: Sign in as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } }
      responses: { '200': { $ref: '#/components/responses/TokensSuccess' } }
  /admin/stats:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Retrieve admin metrics
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Paginated user list
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/transactions:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Paginated transaction list
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    WalletId: { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    CallbackToken: { name: token, in: query, required: true, schema: { type: string }, description: Provider callback secret }
  schemas:
    RegisterInput:
      type: object
      required: [phoneNumber, name, password]
      properties: { phoneNumber: { type: string, example: '+254712345678' }, name: { type: string }, email: { type: string, format: email }, password: { type: string, format: password, minLength: 8 } }
    LoginInput:
      type: object
      required: [phoneNumber, password]
      properties: { phoneNumber: { type: string }, password: { type: string, format: password } }
    LinkWalletInput:
      type: object
      required: [provider, walletNumber]
      properties: { provider: { type: string, enum: [MPESA, MTN_MOMO] }, walletNumber: { type: string } }
    QuoteInput:
      type: object
      required: [senderWalletId, recipientProvider, amount]
      properties: { senderWalletId: { type: string, format: uuid }, recipientProvider: { type: string, enum: [MPESA, MTN_MOMO] }, amount: { type: number, exclusiveMinimum: 0 } }
    TransferInput:
      allOf:
        - { $ref: '#/components/schemas/QuoteInput' }
        - type: object
          required: [recipientNumber]
          properties: { recipientNumber: { type: string }, description: { type: string, maxLength: 100 } }
  responses:
    Success: { description: Successful response }
    Error: { description: Error response }
    AuthSuccess: { description: User and JWT token pair }
    TokensSuccess: { description: JWT token pair }
    WalletSuccess: { description: Wallet response }
    WalletListSuccess: { description: Wallet list response }
